<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>玻璃态导航页</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 后续CSS、JS写在这里 -->
    <style>
        /* 暂时空着，下一节写玻璃样式 */
        /* 全局重置，清除默认边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面占满全屏，禁止滚动 */
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "微软雅黑", sans-serif;
        }

        /* 底层全屏背景容器 */
        .bg-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("bg/1.jpg") center / cover no-repeat;
            z-index: -1;

            /* 叠加暗层，加深壁纸，玻璃效果更突出 */
            &::after {
                content: "";
                position: absolute;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.1);
            }
        }

        /* 总容器，铺满屏幕，方便子元素绝对定位 */
        .page-container {
            width: 100%;
            height: 100%;
            position: relative;
            padding: 40px;
        }

        /* 1. 左侧信息面板：固定在页面左边 */
        .left-panel {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 2. 右上角时钟面板 */
        .clock-panel {
            position: absolute;
            left: 50%;
            top: 12%;
            transform: translateX(-50%);
            text-align: center;
            padding: 0;
            /* 强制清除所有边框、阴影、背景 */
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border-radius: 0;
        }

        #time-text {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            margin-bottom: 6px;
        }

        #date-text {
            font-size: 15px;
            opacity: 0.85;
            color: #fff;
        }


        /* 3. 中间导航卡片组，页面居中区域 */
        .nav-card-group {
            position: absolute;
            left: 280px;
            top: 68%;
            transform: translateY(-50%);
            width: calc(100% - 320px);
            height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
            /* 左右统一留12px空隙，上下10px，放大不会被切掉圆角 */
            padding: 10px 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        /* 内部卡片网格布局：固定4列，自动换行 */
        .nav-card-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        /* 美化滚动条（透明细条，贴合玻璃风格） */
        .nav-card-group::-webkit-scrollbar {
            width: 4px;
        }

        .nav-card-group::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }

        .nav-card-group::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 4. 底部图标栏，页面左下角 */
        .icon-bar {
            position: absolute;
            bottom: 40px;
            left: 40px;
            display: flex;
            gap: 14px;
        }

        .icon-item {
            width: 40px;
            height: 40px;
        }

        /* 统一所有玻璃面板通用样式，一次性复用 */
        .glass {
            /* 提高白色透明度，从0.15改成0.22，更明显 */
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            /* 边框反光更清晰 */
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            color: #ffffff;
            padding: 16px;
        }

        /* 给所有模块加上glass类，这里补充对应选择器 */
        .left-panel>div {
            width: 100%;
        }


        /* 单个导航卡片玻璃样式 */
        .nav-card {
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            transition: all 0.3s ease;
            /* 悬浮动画过渡 */
            padding: 12px;
        }

        /* 鼠标悬浮卡片轻微放大提亮，和原图交互一致 */
        .nav-card:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.22);
        }

        /* 底部小图标玻璃块 */
        .icon-item {
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .icon-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-4px);
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: "微软雅黑", sans-serif;
            color: #fff;
            /* 全局文字白色 */
        }

        /* 清除所有超链接默认样式 */
        a {
            text-decoration: none;
            color: #fff;
            display: block;
            width: 100%;
            height: 100%;
        }

        #time-text {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #date-text {
            font-size: 14px;
            opacity: 0.85;
        }

        /* 头像样式 */
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* 标签容器布局 */
        .tag-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tag-item {
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }

        .card-desc {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.75;
        }

        /* 卡片内部垂直布局 */
        .nav-card {
            height: 240px;
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            transition: all 0.3s ease;
            padding: 0;
            /* 取消整体内边距，图片贴满卡片顶部 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 图片圆角跟随卡片 */
        }

        /* 图片区域：占卡片65%高度 */
        .card-img {
            width: 100%;
            height: 65%;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 图片不变形裁剪铺满 */
            display: block;
        }

        /* 文字区域：剩余35%高度，居中留白 */
        .card-text {
            flex: 1;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 12px;
            opacity: 0.75;
        }

        /* 右上角播放器定位，原时钟位置 */
        .music-panel {
            position: absolute;
            right: 40px;
            top: 40px;
            width: 220px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 歌曲封面 */
        .music-cover {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
        }

        .music-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 歌曲文字 */
        .song-name {
            font-size: 16px;
            font-weight: 500;
        }

        .song-author {
            font-size: 12px;
            opacity: 0.7;
        }

        /* 播放按钮区 */
        .music-control {
            display: flex;
            justify-content: space-around;
            font-size: 20px;
            padding: 4px 0;
        }

        .music-control i {
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .music-control i:hover {
            opacity: 0.7;
        }

        /* 进度条 */
        .music-progress {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .progress-bar {
            width: 35%;
            height: 100%;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
        }

        /* 遮罩弹窗 */
        .wallpaper-modal {
            display: none;
            /* 默认隐藏 */
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        /* 打开时才启用flex */
        .wallpaper-modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 24px;
            color: #fff;
            width: 620px;
        }

        .wall-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .wall-item {
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .wall-item:hover {
            border-color: #fff;
        }

        .wall-item img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .close-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>

    <!-- 音频核心，页面看不见，负责发声，不能删 -->
    <audio id="audio-player">
        <script>
            // 定义更新时间函数
            function updateClock() {
                // 获取当前系统时间
                const now = new Date();

                // 提取 时、分、秒
                let hour = now.getHours();
                let minute = now.getMinutes();
                let second = now.getSeconds();

                // 提取 年、月、日、星期
                const year = now.getFullYear();
                const month = now.getMonth() + 1; // 月份从0开始，要+1
                const day = now.getDate();
                const weekArr = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
                const week = weekArr[now.getDay()];

                // 补零函数：数字小于10前面加0，比如 9秒 → 09
                function addZero(num) {
                    return num < 10 ? "0" + num : num;
                }

                // 拼接格式化文本
                const timeStr = `${addZero(hour)}:${addZero(minute)}:${addZero(second)}`;
                const dateStr = `${year}年${addZero(month)}月${addZero(day)}日 ${week}`;

                // 把文字渲染到页面
                document.getElementById("time-text").innerText = timeStr;
                document.getElementById("date-text").innerText = dateStr;
            }

            // 页面加载立刻执行一次时钟
            updateClock();
            // 每1000毫秒(1秒)自动刷新一次
            setInterval(updateClock, 1000);

            // 歌曲列表，新增歌曲直接在这里加对象
            // 歌曲列表，自行修改路径、歌名、歌手
            // 歌曲列表，自行修改文件路径、歌名、歌手
            const songList = [
                {
                    src: "music/Vuxa - 暮春.mp3",
                    cover: "bg/1.jpg",
                    name: "暮春",
                    author: "Vuxa"
                },
                {
                    src: "music/K7 - 我撕裂我的身体.mp3",
                    cover: "bg/1.jpg",
                    name: "我撕裂我的身体",
                    author: "K7"
                }
            ];

            // 当前播放下标
            let currentIndex = 0;

            // 一次性获取所有页面元素（仅声明一次，无重复变量报错）
            const audio = document.getElementById('audio-player');
            const coverImg = document.getElementById('cover-img');
            const songName = document.getElementById('song-name');
            const songAuthor = document.getElementById('song-author');
            const playBtn = document.querySelector('.play-btn');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');
            const progressBar = document.querySelector('.progress-bar');

            // 加载歌曲函数，带空值容错，杜绝null报错
            function loadSong(index) {
                if (!audio || !coverImg || !songName || !songAuthor) return;
                const targetSong = songList[index];
                audio.src = targetSong.src;
                coverImg.src = targetSong.cover;
                songName.innerText = targetSong.name;
                songAuthor.innerText = targetSong.author;
            }

            // 页面初始化加载第一首
            loadSong(currentIndex);

            // 播放/暂停按钮
            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                    playBtn.classList.replace('fa-play', 'fa-pause');
                } else {
                    audio.pause();
                    playBtn.classList.replace('fa-pause', 'fa-play');
                }
            });

            // 下一首按钮
            nextBtn.addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % songList.length;
                loadSong(currentIndex);
                audio.play();
                playBtn.classList.replace('fa-play', 'fa-pause');
            });

            // 上一首按钮
            prevBtn.addEventListener('click', () => {
                currentIndex = (currentIndex - 1 + songList.length) % songList.length;
                loadSong(currentIndex);
                audio.play();
                playBtn.classList.replace('fa-play', 'fa-pause');
            });

            // 实时更新进度条
            audio.addEventListener('timeupdate', () => {
                if (!audio.duration) return;
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = progressPercent + "%";
            });

            // 歌曲播放完毕自动切下一首
            audio.addEventListener('ended', () => {
                nextBtn.click();
            });


            const settingBtn = document.getElementById('settingBtn');
            const modal = document.getElementById('wallpaperModal');
            const closeBtn = document.querySelector('.close-btn');
            const wallItems = document.querySelectorAll('.wall-item');

            // 点击齿轮打开弹窗
            settingBtn.onclick = () => {
                modal.classList.add('show');
            }
            // 关闭弹窗
            closeBtn.onclick = () => {
                modal.classList.remove('show');
            }

            // 点击壁纸切换背景
            wallItems.forEach(item => {
                item.onclick = () => {
                    const bgUrl = item.dataset.bg;
                    document.querySelector('.bg-wrap').style.background = `url(${bgUrl}) center / cover no-repeat`;
                    modal.classList.remove('show');
                    // 持久化保存壁纸，刷新不丢失
                    localStorage.setItem("bgImage", bgUrl);
                }
            });

            // 页面加载自动恢复上次壁纸
            window.addEventListener('load', () => {
                const savedBg = localStorage.getItem("bgImage");
                if (savedBg) {
                    document.querySelector('.bg-wrap').style.background = `url(${savedBg}) center / cover no-repeat`;
                }
            })
        </script>
</body>


</html>
