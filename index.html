<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyyy | 个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        :root{
            --bg-color:#1a1a1a;
            --card-bg:rgba(255,255,255,0.1);
            --text-color:#fff;
        }
        body{
            min-height:100vh;
            background-color:var(--bg-color);
            color:var(--text-color);
            padding:4rem 1rem 8rem;
            transition:background 0.3s ease, color 0.3s ease;
        }
        body.light-mode{
            --bg-color:#f0f0f0;
            --card-bg:rgba(0,0,0,0.1);
            --text-color:#222;
        }
        .mask{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.3);
            z-index:-1;
        }
        nav{
            position:fixed;top:0;left:0;width:100%;
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(10px);
            padding:0.8rem 0;
            text-align:center;
            z-index:99;
        }
        nav a{
            color:var(--text-color);text-decoration:none;margin:0 1rem;
            font-size:1rem;
        }
        .theme-toggle{
            position:fixed;top:0.7rem;right:1rem;
            background:var(--card-bg);
            border:none;color:var(--text-color);
            width:36px;height:36px;
            border-radius:50%;cursor:pointer;
            z-index:100;
        }
        .container{max-width:700px;margin:0 auto;text-align:center;animation:fadeIn 1.5s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        .avatar{
            width:120px;height:120px;border-radius:50%;
            background:var(--card-bg);
            border:4px solid rgba(255,255,255,0.3);
            margin:0 auto 1.5rem;
            display:flex;align-items:center;justify-content:center;
            font-size:3rem;font-weight:bold;backdrop-filter:blur(10px);
        }
        h1{font-size:2.5rem;margin-bottom:0.5rem;text-shadow:0 2px 10px rgba(0,0,0,0.5);}
        .info-bar{
            background:var(--card-bg);
            backdrop-filter:blur(10px);
            border-radius:12px;padding:12px;
            margin-bottom:1rem;font-size:15px;line-height:1.6;
        }
        .card{
            background:var(--card-bg);
            backdrop-filter:blur(10px);
            border-radius:16px;padding:1.5rem;
            margin-bottom:1.5rem;border:1px solid rgba(255,255,255,0.2);
        }
        .yan-text{font-style:italic;font-size:16px;}
        .btn{
            display:inline-block;padding:0.8rem 1.8rem;
            background:var(--card-bg);color:var(--text-color);
            border-radius:50px;text-decoration:none;
            border:2px solid rgba(255,255,255,0.3);
            transition:all 0.3s ease;margin:6px;
        }
        .btn:hover{background:var(--text-color);color:var(--bg-color);transform:translateY(-3px);}

        /* 音乐播放器 */
        .music-box{
            position:fixed;bottom:0;left:0;width:100%;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(12px);
            padding:12px 20px;
            display:flex;align-items:center;justify-content:center;gap:15px;
            z-index:99;
        }
        .music-name{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .music-btn{background:#fff;color:#222;border:none;border-radius:20px;padding:4px 12px;cursor:pointer;}

        /* 粒子画布 */
        #particles{position:fixed;inset:0;pointer-events:none;z-index:1;}
    </style>
</head>
<body>
<!-- 粒子特效画布 -->
<canvas id="particles"></canvas>

<div class="mask"></div>

<!-- 顶部导航 -->
<nav>
    <a href="#">首页</a>
    <a href="#">关于我</a>
    <a href="#">项目</a>
    <button class="theme-toggle" id="themeToggle">🌙</button>
</nav>

<div class="container">
    <div class="avatar">O</div>
    <h1>欢迎来到 Oyyy 个人主页</h1>

    <div class="info-bar">
        <div id="now-time">⏳ 加载时间中...</div>
        <div id="user-area">🌍 定位加载中...</div>
        <div id="visit-count">👁️ 本站总访问：<span id="count">1</span> 次</div>
    </div>

    <div class="card">
        <p class="yan-text" id="yan">📜 正在加载今日语录...</p>
    </div>

    <div class="card">
        <h3>👋 关于我</h3>
        <p>热爱折腾网站与技术，本站基于 GitHub Pages + 第三方接口搭建</p>
    </div>

    <div>
        <a href="https://github.com/oyyy6b" class="btn">我的 GitHub</a>
    </div>
</div>

<!-- 音乐播放器（改为本地示例，可自行替换MP3） -->
<div class="music-box">
    <span class="music-name" id="songName">🎵 未选择歌曲</span>
    <button class="music-btn" id="prevBtn">上一首</button>
    <button class="music-btn" id="playBtn">播放</button>
    <button class="music-btn" id="nextBtn">下一首</button>
    <audio id="audioPlayer">
</div>

<script>
// 1. 实时时间（本地实现，永不失效）
function upTime(){
    let n=new Date();
    let y=n.getFullYear(),m=n.getMonth()+1,d=n.getDate();
    let h=n.getHours().toString().padStart(2,'0');
    let mi=n.getMinutes().toString().padStart(2,'0');
    let s=n.getSeconds().toString().padStart(2,'0');
    let week=['周日','周一','周二','周三','周四','周五','周六'][n.getDay()];
    document.getElementById("now-time").innerText=`🕒 ${y}年${m}月${d}日 ${h}:${mi}:${s} ${week}`;
}
upTime();setInterval(upTime,1000);

// 2. 访客属地（恢复原来可用的接口）
fetch("https://api.ip.sb/geoip")
.then(res=>res.json())
.then(ip=>{
    document.getElementById("user-area").innerText=`🌍 你的位置：${ip.isp} | ${ip.city}`;
})
.catch(()=>{
    document.getElementById("user-area").innerText=`🌍 位置信息加载失败`;
});
    
// 3. 访问统计（本地Cookie实现，永久可用）
function countVisit(){
    let count = localStorage.getItem('visitCount') || 0;
    count = parseInt(count) + 1;
    localStorage.setItem('visitCount', count);
    document.getElementById('count').innerText = count;
}
countVisit();

// 4. 每日一言（本地语录库，随机显示，永不失效）
const quotes = [
    "热爱可抵岁月漫长",
    "保持热爱，奔赴山海",
    "慢慢来，会更好",
    "道阻且长，行则将至",
    "心有丘壑，立马振山河",
    "以梦为马，不负韶华",
    "凡是过往，皆为序章",
    "愿你眼里的星星，温柔又明亮"
];
document.getElementById("yan").innerText = `📜 ${quotes[Math.floor(Math.random()*quotes.length)]}`;

// 5. 暗黑模式
const themeToggle=document.getElementById('themeToggle');
themeToggle.onclick=()=>{
    document.body.classList.toggle('light-mode');
    themeToggle.innerText=document.body.classList.contains('light-mode')?'☀️':'🌙';
}

// ========== 6. 音乐播放器（改为本地可配置，避免接口失效） ==========
const audio=document.getElementById('audioPlayer');
const songNameDom=document.getElementById('songName');
const playBtn=document.getElementById('playBtn');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');

// 本地歌单（可自行替换成你的MP3地址）
const playlist = [
  {
    name: "暮春",
    artist: "Vuxa",
    url: "Vuxa - 暮春.mp3"
  },
  {
    name: "我撕裂我的身体",
    artist: "K7",
    url: "K7 - 我撕裂我的身体.mp3"
  }
];
let nowIndex=0,isPlay=false;

function loadMusic(idx){
    if(playlist[idx].url){
        audio.src = playlist[idx].url;
        songNameDom.innerText = '🎵 ' + playlist[idx].name + ' - ' + playlist[idx].artist;
    }else{
        songNameDom.innerText = '🎵 请添加本地歌曲';
    }
}
playBtn.onclick=()=>{
    if(!playlist[nowIndex].url){
        alert("请先在代码中添加歌曲地址！");
        return;
    }
    if(isPlay){
        audio.pause();
        playBtn.innerText="播放";
        isPlay=false;
    }else{
        audio.play().then(()=>{
            playBtn.innerText="暂停";
            isPlay=true;
        }).catch(()=>{
            songNameDom.innerText='🎵 无法播放，请添加歌曲';
        });
    }
}
nextBtn.onclick=()=>{
    nowIndex = (nowIndex + 1) % playlist.length;
    loadMusic(nowIndex);
    if(isPlay && playlist[nowIndex].url) audio.play();
}
prevBtn.onclick=()=>{
    nowIndex = (nowIndex - 1 + playlist.length) % playlist.length;
    loadMusic(nowIndex);
    if(isPlay && playlist[nowIndex].url) audio.play();
}
audio.addEventListener('ended',()=>nextBtn.click());

// ========== 7. 鼠标点击粒子特效（纯本地实现，无依赖） ==========
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let w=canvas.width=window.innerWidth;
let h=canvas.height=window.innerHeight;
window.onresize=()=>{
    w=canvas.width=window.innerWidth;
    h=canvas.height=window.innerHeight;
};

class Particle{
    constructor(x,y){
        this.x=x;this.y=y;
        this.r=Math.random()*4+2;
        this.dx=Math.random()*6-3;
        this.dy=Math.random()*6-3;
        this.alpha=1;
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(135,206,255,${this.alpha})`;
        ctx.fill();
    }
    update(){
        this.x+=this.dx;
        this.y+=this.dy;
        this.alpha-=0.02;
    }
}
let particles=[];
canvas.onclick=e=>{
    for(let i=0;i<20;i++){
        particles.push(new Particle(e.clientX,e.clientY));
    }
}
function animate(){
    ctx.clearRect(0,0,w,h);
    for(let i=particles.length-1;i>=0;i--){
        particles[i].draw();
        particles[i].update();
        if(particles[i].alpha<=0){
            particles.splice(i,1);
        }
    }
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
